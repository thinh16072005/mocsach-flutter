server:
  port: 8084

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=db_order;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.SQLServerDialect
    show-sql: false

services:
  book-url: ${SERVICES_BOOK_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.bookstore.order: DEBUG
