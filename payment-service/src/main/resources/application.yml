server:
  port: 8085

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=db_payment;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.SQLServerDialect
    show-sql: false

payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}
  return-url: ${PAYOS_RETURN_URL:https://pay.payos.vn/web/}
  cancel-url: ${PAYOS_CANCEL_URL:https://pay.payos.vn/web/}

services:
  order-url: ${SERVICES_ORDER_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.bookstore.payment: DEBUG
